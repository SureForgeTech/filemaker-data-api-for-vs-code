name: Dependency Auto-merge

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]

permissions: {}

jobs:
  dependabot-dev-deps:
    permissions:
      contents: write
      pull-requests: write
    if: |
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.draft == false
    runs-on: ${{ fromJSON(vars.LINUX_RUNNER_LABELS) }}
    steps:
      - name: Read Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ github.token }}

      # Only the trusted base supplies the local action in this pull_request_target job.
      - name: Checkout base for local actions
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Ensure GitHub CLI is available
        uses: ./.github/actions/ensure-gh

      - name: Enable auto-merge for safe dev dependencies
        if: |
          steps.metadata.outputs.dependency-type == 'direct:development' &&
          (
            steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
            steps.metadata.outputs.update-type == 'version-update:semver-minor'
          )
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          "$RUNNER_TEMP/gh-cli/bin/gh" pr merge --auto --squash "$PR_URL"
